<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saufik Ramadhan — Portfolio</title>
  <meta name="description" content="Saufik Ramadhan — frontend engineer in Jakarta. Biography, education, work experience, 3D design, embedded electronics projects, certifications, awards and language proficiency." />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Saufik Ramadhan — Portfolio" />
  <meta property="og:description" content="Frontend engineer with 6+ years in React, Next.js and React Native — and a microelectronics background." />

  <!-- Resolve the theme before first paint so there is no flash. Light is the default. -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('site-theme');
        if (saved === 'dark' || saved === 'light') theme = saved;
      } catch (e) { /* private mode */ }
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <!-- ?v= is bumped on every asset change so returning visitors never get a stale cache. -->
  <link rel="stylesheet" href="assets/css/style.css?v=8" />
</head>
<body>
  <a class="skip-link" href="#about" data-i18n="ui.skip">Skip to content</a>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="site-header" id="header">
    <div class="shell header__inner">
      <a class="brand" href="#top">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name" data-bind="meta.name"></span>
      </a>

      <nav class="nav" id="nav" aria-label="Primary">
        <ul class="nav__list" id="nav-list"></ul>
      </nav>

      <div class="header__tools">
        <button class="icon-btn" id="theme-btn" type="button" aria-pressed="false">
          <svg class="icon icon--sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" />
          </svg>
          <svg class="icon icon--moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z" />
          </svg>
        </button>

        <div class="lang" id="lang">
          <button class="lang__btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18" />
            </svg>
            <span id="lang-current">EN</span>
          </button>
          <ul class="lang__menu" id="lang-menu" role="listbox" aria-label="Language"></ul>
        </div>

        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu">
          <span class="menu-btn__bar"></span>
          <span class="menu-btn__bar"></span>
        </button>
      </div>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <div class="mobile-menu" id="mobile-menu" hidden>
    <ul class="mobile-menu__list" id="mobile-nav-list"></ul>
  </div>

  <!-- ── Masthead ───────────────────────────────────────────── -->
  <div class="masthead" id="top">
    <div class="shell">
      <div class="masthead__grid">
        <div class="masthead__main">
          <p class="masthead__status">
            <span class="dot" aria-hidden="true"></span>
            <span data-bind="meta.status"></span>
          </p>
          <h1 class="masthead__name" data-bind="meta.name"></h1>
          <p class="masthead__role" data-bind="meta.role"></p>
          <p class="masthead__tagline" data-bind="meta.tagline"></p>
        </div>
        <dl class="masthead__meta" id="masthead-meta"></dl>
      </div>
    </div>
  </div>

  <main>
    <!-- ── 01 About ─────────────────────────────────────────── -->
    <section class="section" id="about">
      <div class="shell section__grid">
        <div class="section__head">
          <span class="section__num">01</span>
          <h2 class="section__title" data-i18n="section.about"></h2>
        </div>
        <div class="section__body">
          <div class="prose" id="about-body"></div>
          <dl class="deflist" id="about-facts"></dl>
        </div>
      </div>
    </section>

    <!-- ── 02 Education ─────────────────────────────────────── -->
    <section class="section" id="education">
      <div class="shell section__grid">
        <div class="section__head">
          <span class="section__num">02</span>
          <h2 class="section__title" data-i18n="section.education"></h2>
        </div>
        <div class="section__body">
          <ol class="entries" id="education-list"></ol>
        </div>
      </div>
    </section>

    <!-- ── 03 Experience ────────────────────────────────────── -->
    <section class="section" id="experience">
      <div class="shell section__grid">
        <div class="section__head">
          <span class="section__num">03</span>
          <h2 class="section__title" data-i18n="section.experience"></h2>
        </div>
        <div class="section__body">
          <ol class="entries" id="experience-list"></ol>
        </div>
      </div>
    </section>

    <!-- ── 04 3D Design ─────────────────────────────────────── -->
    <section class="section" id="design">
      <div class="shell section__grid">
        <div class="section__head">
          <span class="section__num">04</span>
          <h2 class="section__title" data-i18n="section.design"></h2>
        </div>
        <div class="section__body">
          <div class="gallery" id="design-list"></div>
        </div>
      </div>
    </section>

    <!-- ── 05 Electronics ───────────────────────────────────── -->
    <section class="section" id="electronics">
      <div class="shell section__grid">
        <div class="section__head">
          <span class="section__num">05</span>
          <h2 class="section__title" data-i18n="section.electronics"></h2>
        </div>
        <div class="section__body">
          <ol class="entries" id="electronics-list"></ol>
        </div>
      </div>
    </section>

    <!-- ── 06 Certifications ────────────────────────────────── -->
    <section class="section" id="certifications">
      <div class="shell section__grid">
        <div class="section__head">
          <span class="section__num">06</span>
          <h2 class="section__title" data-i18n="section.certifications"></h2>
        </div>
        <div class="section__body">
          <ul class="rows" id="certifications-list"></ul>
        </div>
      </div>
    </section>

    <!-- ── 07 Awards ────────────────────────────────────────── -->
    <section class="section" id="awards">
      <div class="shell section__grid">
        <div class="section__head">
          <span class="section__num">07</span>
          <h2 class="section__title" data-i18n="section.awards"></h2>
        </div>
        <div class="section__body">
          <ul class="rows" id="awards-list"></ul>
        </div>
      </div>
    </section>

    <!-- ── 08 Languages ─────────────────────────────────────── -->
    <section class="section" id="languages">
      <div class="shell section__grid">
        <div class="section__head">
          <span class="section__num">08</span>
          <h2 class="section__title" data-i18n="section.languages"></h2>
        </div>
        <div class="section__body">
          <ul class="langs" id="languages-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <!-- ── Contact / Footer ───────────────────────────────────── -->
  <footer class="footer" id="contact">
    <div class="shell">
      <div class="footer__top">
        <p class="footer__kicker" data-i18n="ui.contactKicker"></p>
        <a class="footer__mail" id="footer-email" href="#"></a>
      </div>
      <div class="footer__bottom">
        <p class="footer__copy"><span id="footer-year"></span> · <span data-bind="meta.name"></span></p>
        <ul class="footer__links" id="footer-links"></ul>
      </div>
    </div>
  </footer>

  <script src="assets/js/content.js?v=8"></script>
  <script src="assets/js/app.js?v=8"></script>
</body>
</html>
