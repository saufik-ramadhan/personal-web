<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saufik Ramadhan — Portfolio</title>
  <meta name="description" content="Saufik Ramadhan — frontend engineer in Jakarta. Biography, education, work experience, 3D design, embedded electronics projects, certifications, awards and language proficiency." />
  <meta name="color-scheme" content="light dark" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Saufik Ramadhan — Portfolio" />
  <meta property="og:description" content="Frontend engineer with 6+ years in React, Next.js and React Native — and a microelectronics background." />

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <a class="skip-link" href="#about" data-i18n="ui.skip">Skip to content</a>

  <!-- ── Header ─────────────────────────────────────────────── -->
  <header class="site-header" id="header">
    <div class="shell header__inner">
      <a class="brand" href="#top">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__name" data-bind="meta.name"></span>
      </a>

      <nav class="nav" id="nav" aria-label="Primary">
        <ul class="nav__list" id="nav-list"></ul>
      </nav>

      <div class="header__tools">
        <div class="lang" id="lang">
          <button class="lang__btn" id="lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18" />
            </svg>
            <span id="lang-current">EN</span>
          </button>
          <ul class="lang__menu" id="lang-menu" role="listbox" aria-label="Language"></ul>
        </div>

        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu">
          <span class="menu-btn__bar"></span>
          <span class="menu-btn__bar"></span>
        </button>
      </div>
    </div>
    <div class="progress" id="progress"></div>
  </header>

  <div class="mobile-menu" id="mobile-menu" hidden>
    <ul class="mobile-menu__list" id="mobile-nav-list"></ul>
  </div>

  <main id="top">
    <!-- ── Hero ─────────────────────────────────────────────── -->
    <section class="hero">
      <div class="shell hero__inner">
        <p class="hero__status reveal">
          <span class="dot" aria-hidden="true"></span>
          <span data-bind="meta.status"></span>
        </p>
        <h1 class="hero__title reveal">
          <span class="hero__name" data-bind="meta.name"></span>
          <span class="hero__role" data-bind="meta.role"></span>
        </h1>
        <p class="hero__tagline reveal" data-bind="meta.tagline"></p>
        <div class="hero__meta reveal">
          <div class="hero__meta-item">
            <span class="label" data-i18n="ui.basedIn"></span>
            <span data-bind="meta.location"></span>
          </div>
          <div class="hero__meta-item">
            <span class="label" data-i18n="ui.email"></span>
            <a id="hero-email" href="#"></a>
          </div>
        </div>
        <div class="hero__actions reveal">
          <a class="btn btn--solid" href="#design" data-i18n="ui.ctaWork"></a>
          <a class="btn btn--ghost" href="#contact" data-i18n="ui.ctaContact"></a>
        </div>
      </div>
      <div class="hero__scroll" aria-hidden="true">
        <span data-i18n="ui.scroll"></span>
        <span class="hero__scroll-line"></span>
      </div>
    </section>

    <!-- ── 01 About ─────────────────────────────────────────── -->
    <section class="section" id="about">
      <div class="shell section__grid">
        <div class="section__head reveal">
          <span class="section__num">01</span>
          <h2 class="section__title" data-i18n="section.about"></h2>
        </div>
        <div class="section__body">
          <div class="prose reveal" id="about-body"></div>
          <ul class="facts" id="about-facts"></ul>
        </div>
      </div>
    </section>

    <!-- ── 02 Education ─────────────────────────────────────── -->
    <section class="section section--alt" id="education">
      <div class="shell section__grid">
        <div class="section__head reveal">
          <span class="section__num">02</span>
          <h2 class="section__title" data-i18n="section.education"></h2>
        </div>
        <div class="section__body">
          <ol class="timeline" id="education-list"></ol>
        </div>
      </div>
    </section>

    <!-- ── 03 Experience ────────────────────────────────────── -->
    <section class="section" id="experience">
      <div class="shell section__grid">
        <div class="section__head reveal">
          <span class="section__num">03</span>
          <h2 class="section__title" data-i18n="section.experience"></h2>
        </div>
        <div class="section__body">
          <ol class="timeline" id="experience-list"></ol>
        </div>
      </div>
    </section>

    <!-- ── 04 3D Design ─────────────────────────────────────── -->
    <section class="section section--alt" id="design">
      <div class="shell section__grid">
        <div class="section__head reveal">
          <span class="section__num">04</span>
          <h2 class="section__title" data-i18n="section.design"></h2>
        </div>
        <div class="section__body">
          <div class="gallery" id="design-list"></div>
        </div>
      </div>
    </section>

    <!-- ── 05 Electronics ───────────────────────────────────── -->
    <section class="section" id="electronics">
      <div class="shell section__grid">
        <div class="section__head reveal">
          <span class="section__num">05</span>
          <h2 class="section__title" data-i18n="section.electronics"></h2>
        </div>
        <div class="section__body">
          <div class="cards" id="electronics-list"></div>
        </div>
      </div>
    </section>

    <!-- ── 06 Certifications ────────────────────────────────── -->
    <section class="section section--alt" id="certifications">
      <div class="shell section__grid">
        <div class="section__head reveal">
          <span class="section__num">06</span>
          <h2 class="section__title" data-i18n="section.certifications"></h2>
        </div>
        <div class="section__body">
          <ul class="rows" id="certifications-list"></ul>
        </div>
      </div>
    </section>

    <!-- ── 07 Awards ────────────────────────────────────────── -->
    <section class="section" id="awards">
      <div class="shell section__grid">
        <div class="section__head reveal">
          <span class="section__num">07</span>
          <h2 class="section__title" data-i18n="section.awards"></h2>
        </div>
        <div class="section__body">
          <ul class="rows" id="awards-list"></ul>
        </div>
      </div>
    </section>

    <!-- ── 08 Languages ─────────────────────────────────────── -->
    <section class="section section--alt" id="languages">
      <div class="shell section__grid">
        <div class="section__head reveal">
          <span class="section__num">08</span>
          <h2 class="section__title" data-i18n="section.languages"></h2>
        </div>
        <div class="section__body">
          <ul class="langs" id="languages-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <!-- ── Contact / Footer ───────────────────────────────────── -->
  <footer class="footer" id="contact">
    <div class="shell">
      <div class="footer__top reveal">
        <p class="footer__kicker" data-i18n="ui.contactKicker"></p>
        <a class="footer__mail" id="footer-email" href="#"></a>
      </div>
      <div class="footer__bottom">
        <p class="footer__copy"><span id="footer-year"></span> · <span data-bind="meta.name"></span></p>
        <ul class="footer__links" id="footer-links"></ul>
      </div>
    </div>
  </footer>

  <script src="assets/js/content.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
